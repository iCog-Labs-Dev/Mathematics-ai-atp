# Mathematics AI ATP - Docker Compose Configuration
#
# Architecture:
#   - asset-fetch: init service that downloads model+corpus from HF Hub once
#   - api: HTTP API server (FastAPI/uvicorn) serving /health, /prove, /gnn/predict_tactic, /pln/evaluate
#   - core: batch joint-prover (profile: batch) for one-off CLI runs
#   - experimental: on-demand sandbox for experiments/ (profile: experimental)
#   - training: batch job service for training (profile: training)
#
# Usage:
#   docker compose up                                   # fetch assets, then start the API server
#   docker compose up api                               # start only the API server
#   curl http://localhost:8000/health                    # check API health
#   curl -X POST http://localhost:8000/prove -H 'Content-Type: application/json' -d '{"goal": "..."}'
#   docker compose --profile experimental up experimental
#   docker compose --profile batch run --rm core --goal_statement '...'
#
# Volume layout:
#   - models-corpus-cache: shared volume for model+corpus (read-only for core/experimental)
#   - training-output: separate volume for training outputs

services:
  # Asset fetch service - runs once, downloads model+corpus from HuggingFace Hub
  asset-fetch:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: core
    container_name: maths_ai-asset-fetch
    volumes:
      - models-corpus-cache:/data
    environment:
      - MATHS_AI_DATA_ROOT=/data
      - MATHS_AI_MODEL_CONFIG=/workspace/maths_ai/config/models/premise_gnn.yaml
      - MATHS_AI_CORPUS_CONFIG=/workspace/maths_ai/config/corpus/lemma_corpus_v1.yaml
      # Required while the HF repos are private; read from the host environment.
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: ["python", "scripts/fetch_assets.py"]
    networks:
      - maths_ai_network

  # API service - serves proof/inference requests over HTTP
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: core
    container_name: maths_ai-api
    depends_on:
      asset-fetch:
        condition: service_completed_successfully
    ports:
      - "${MATHS_AI_API_PORT:-8000}:8000"
    volumes:
      - models-corpus-cache:/data:ro
    environment:
      - MATHS_AI_DATA_ROOT=/data
      - MATHS_AI_MODEL_CONFIG=/workspace/maths_ai/config/models/premise_gnn.yaml
      - MATHS_AI_CORPUS_CONFIG=/workspace/maths_ai/config/corpus/lemma_corpus_v1.yaml
      - MATHS_AI_LEAN_PROJECT=/opt/lean_project
      - MATHS_AI_API_HOST=0.0.0.0
      - MATHS_AI_API_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - maths_ai_network

  # Core service - batch joint prover (for one-off proof runs)
  core:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: core
    container_name: maths_ai-core
    depends_on:
      asset-fetch:
        condition: service_completed_successfully
    volumes:
      - models-corpus-cache:/data:ro
    environment:
      - MATHS_AI_DATA_ROOT=/data
      - MATHS_AI_MODEL_CONFIG=/workspace/maths_ai/config/models/premise_gnn.yaml
      - MATHS_AI_CORPUS_CONFIG=/workspace/maths_ai/config/corpus/lemma_corpus_v1.yaml
      - MATHS_AI_LEAN_PROJECT=/opt/lean_project
    # Override CMD to run batch prover instead of API
    command: ["python", "-m", "maths_ai.hybrid_reasoner.joint_inference"]
    profiles:
      - batch
    networks:
      - maths_ai_network

  # Experimental service - sandbox for experiments/, on demand
  experimental:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: experimental
    container_name: maths_ai-experimental
    profiles:
      - experimental
    volumes:
      - models-corpus-cache:/data:ro
    environment:
      - MATHS_AI_DATA_ROOT=/data
      - MATHS_AI_MODEL_CONFIG=/workspace/maths_ai/config/models/premise_gnn.yaml
      - MATHS_AI_CORPUS_CONFIG=/workspace/maths_ai/config/corpus/lemma_corpus_v1.yaml
      - MATHS_AI_LEAN_PROJECT=/opt/lean_project
    networks:
      - maths_ai_network

  # Training service - batch job, GPU-optional
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: training
    container_name: maths_ai-training
    profiles:
      - training
    volumes:
      - models-corpus-cache:/data:ro
      - training-output:/output
    environment:
      - MATHS_AI_DATA_ROOT=/data
      - MATHS_AI_MODEL_CONFIG=/workspace/maths_ai/config/models/premise_gnn.yaml
      - MATHS_AI_CORPUS_CONFIG=/workspace/maths_ai/config/corpus/lemma_corpus_v1.yaml
      - MATHS_AI_LEAN_PROJECT=/opt/lean_project
      - MATHS_AI_OUTPUT_DIR=/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - maths_ai_network

volumes:
  models-corpus-cache:
    name: maths_ai-models-corpus-cache
  training-output:
    name: maths_ai-training-output

networks:
  maths_ai_network:
    driver: bridge

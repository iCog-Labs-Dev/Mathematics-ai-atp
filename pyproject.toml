[project]
name = "mathematics-ai-atp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.14.2",
    "fastapi>=0.115.0",
    "graphviz>=0.21",
    "huggingface-hub>=0.20.0",
    "httpx>=0.27.0",
    "pantograph",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "pytest>=9.0.3",
    "regex>=2024.11.6",
    "safetensors>=0.5.3",
    "torch>=2.12.0",
    "torch-geometric>=2.7.0",
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "uvicorn>=0.30.0",
    "annotated-types>=0.7.0",
    "iniconfig>=2.3.0",
    "packaging>=26.1",
    "pluggy>=1.6.0",
    "pydantic-core>=2.46.4",
    "pygments>=2.20.0",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
]


[tool.uv.sources]
pantograph = { git = "https://github.com/stanford-centaur/PyPantograph", rev = "3322696b72e81ed50f2f7dc0b667f8278a932283" }

[tool.setuptools.packages.find]
where=["."]
include=["maths_ai", "maths_ai.*"]
exclude=["data", "experiments", "tests", "tests.*"]


[dependency-groups]
dev = ["pytest>=9.0.3"]

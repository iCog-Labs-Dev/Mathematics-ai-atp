[project]
name = "mathematics-ai-atp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "faiss-cpu>=1.14.2",
    "fastapi>=0.115.0",
    "graphviz>=0.21",
    "huggingface-hub>=0.36.2,<1",
    "pantograph-async-client @ git+https://github.com/123nol/Pantograph-Client@6a6d611bee093e3a8f389a22bab01518fc60531f",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "torch>=2.12.0",
    "torch-geometric>=2.7.0",
    "transformers>=4.45,<5",
    "uvicorn>=0.30.0",
]


[tool.setuptools.packages.find]
where=["."]
include=["maths_ai", "maths_ai.*"]
exclude=["data", "experiments", "tests", "tests.*"]


[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=9.0.3"]

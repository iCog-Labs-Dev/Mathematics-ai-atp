name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    

permissions:
  contents: read 

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code # checking out the ubuntu machine is empty 
        uses: actions/checkout@v4

      - name: Set up Python 3.11  
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
   
      - name: Install uv 
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev 
        
      - name: Install project 
        run: uv pip install -e . --no-deps 
      - name: Run tests
        run: uv run pytest tests maths_ai -v --tb=short   
